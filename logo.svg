<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .bg-dark { fill: #0e0f13; }
      .gold { fill: #d4af37; }
      .stroke-gold { stroke: #d4af37; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <!-- rounded-square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" class="bg-dark"/>

  <!-- subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="88" ry="88"
        class="stroke-gold" stroke-opacity="0.18" stroke-width="5"/>

  <!-- calibration ring -->
  <circle cx="256" cy="256" r="154"
          class="stroke-gold" stroke-opacity="0.35" stroke-width="5" stroke-dasharray="10 20"/>

  <!-- crosshair X -->
  <line x1="164" y1="164" x2="348" y2="348" class="stroke-gold" stroke-width="26"/>
  <line x1="164" y1="348" x2="348" y2="164" class="stroke-gold" stroke-width="26"/>

  <!-- cardinal ticks -->
  <line x1="256" y1="52"  x2="256" y2="88"  class="stroke-gold" stroke-width="13"/>
  <line x1="256" y1="424" x2="256" y2="460" class="stroke-gold" stroke-width="13"/>
  <line x1="52"  y1="256" x2="88"  y2="256" class="stroke-gold" stroke-width="13"/>
  <line x1="424" y1="256" x2="460" y2="256" class="stroke-gold" stroke-width="13"/>

  <!-- center aperture -->
  <circle cx="256" cy="256" r="18" class="gold"/>
  <circle cx="256" cy="256" r="8"  class="bg-dark"/>
</svg>
